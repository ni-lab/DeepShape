---
ops: [train, evaluate]
model:
  path: ${DEEPSHAPE_ROOT}/model/deepshape.py
  class: DeepShape
  class_args:
    sequence_length: 1000
    n_targets: 1
lr: 0.08
sampler: !obj:intervals_sampler_hdf5.parallel_intervals_sampler.ParallelIntervalsSampler
  reference_sequence: !obj:genome_shape_hdf5.make_genomeshape.GenomeShapeMaker
    input_path: ${DEEPSHAPE_ROOT}/examples/quickstart/genome.fa
    multi_feat_file: ${DEEPSHAPE_ROOT}/examples/quickstart/shape.h5
  features: !obj:selene_sdk.utils.load_features_list
    input_path: ${DEEPSHAPE_ROOT}/examples/quickstart/features.txt
  target_path: ${DEEPSHAPE_ROOT}/examples/quickstart/labels.bed.gz
  intervals_path: ${DEEPSHAPE_ROOT}/examples/quickstart/intervals.bed
  sample_negative: True
  n_processes: 2
  test_holdout: [example_06, example_07, example_14, example_15]
  validation_holdout: [example_04, example_05, example_12, example_13]
  sequence_length: 1000
  center_bin_to_predict: 200
  feature_thresholds: 0.5
  seed: 127
  mode: train
  save_datasets: []
train_model: !obj:selene_sdk.TrainModel
  batch_size: 4
  max_steps: 2
  report_stats_every_n_steps: 1
  report_gt_feature_n_positives: 1
  cpu_n_threads: 2
  n_validation_samples: 8
  n_test_samples: 8
  use_cuda: False
  data_parallel: False
  logging_verbosity: 2
  save_checkpoint_every_n_steps: 1
output_dir: ${DEEPSHAPE_OUTPUT}/training
random_seed: 1447
create_subdirectory: False
